<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Sandbox</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
  </head>
  <body>
    <!-- Name Input Modal -->
    <div class="modal" id="nameModal">
      <div class="modal-content">
        <h2>Enter Your Name</h2>
        <input type="text" id="nameInput" placeholder="Your name" />
        <button class="submit-btn" id="nameSubmitBtn">Start</button>
      </div>
    </div>

    <!-- Number Display Modal -->
    <div class="modal" id="numberModal">
      <div class="modal-content">
        <p>Remember this number!</p>
        <div class="number-display"></div>
      </div>
    </div>

    <!-- Input Interface -->
    <div class="input-interface" id="inputInterface">
      <div class="input-container">
        <h2>Enter the numbers you saw:</h2>
        <div class="number-inputs"></div>
        <button class="submit-btn" id="inputSubmitBtn">Submit</button>
      </div>
    </div>

    <!-- Score Modal -->
    <div class="modal" id="scoreModal">
      <div class="modal-content">
        <h2>Game Over!</h2>
        <p class="score-display"></p>
        <button class="submit-btn" id="playAgainBtn">Play Again</button>
      </div>
    </div>

    <header>
      <div class="logo">
        <img src="https://team.shiksha/images/fa-logo-green-bg.svg" alt="team-shiksha-logo">
        <h1>Vinci Code Game</h1>
      </div>
      <div class="username-container">
        <h3>Hello, <span class="username">Guest</span>! </h3>
        <i class="fa-solid fa-pen-to-square" data-val="3"></i>
      </div>
    </header>
      <div class="start-menu">
        <h1 class="game-name">Number memory</h1>
        <h2 class="game-description">
              The average person can remember 7 numbers at once. Can you do more?
         </h2>
         <div class="game" id="game">
          <button data-val="1" class="play-Btn">Play</button>
          <div class="leaderboard">
              <img data-val="2" src="./leaderboard.png" alt="leaderboard-icon">
          </div>
        </div>
     </div>
    <script src="./index.mjs" type="module"></script>
  </body>
</html>
